<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>העוגות של הודיה - הזמנה</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #fdf8f6;
            color: #4a3f3d;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(217, 174, 162, 0.2);
            width: 100%;
            max-width: 450px;
            position: relative;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 18px;
        }
        .brand-logo-clean {
            width: 100%;
            max-width: 240px;
            height: auto;
            display: block;
            margin: 0 auto 8px auto;
        }
        h1.brand-title {
            color: #c98f7f;
            font-size: 30px;
            font-weight: 800;
            margin: 4px 0 6px 0;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            text-align: center;
            color: #5c4d4a;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label.field-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #5c4d4a;
        }
        input[type="text"], input[type="date"], input[type="time"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5d0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #fff;
            color: #333;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d9aea2;
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        .cake-info-badge {
            background-color: #fdf6f4;
            border: 1px solid #e6cbc3;
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
            color: #7d584e;
        }
        .cake-info-guests {
            background-color: #ffffff;
            color: #5c4d4a;
            border: 1px solid #e6cbc3;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .people-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        .radio-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .radio-option {
            flex: 1;
            min-width: 90px;
        }
        .radio-option input[type="radio"] {
            display: none;
        }
        .radio-option label {
            display: block;
            text-align: center;
            padding: 10px 6px;
            border: 1px solid #e6d5d0;
            border-radius: 8px;
            background-color: #fcf9f8;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: normal;
            transition: all 0.2s;
        }
        .radio-option input[type="radio"]:checked + label {
            background-color: #d9aea2;
            color: white;
            border-color: #d9aea2;
            font-weight: bold;
        }
        .disclaimer-box {
            background-color: #fcf6f4;
            border: 1px solid #ebd5ce;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            color: #6e5c58;
            text-align: center;
            margin-top: 16px;
            line-height: 1.4;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 14px;
            text-align: center;
        }
        .btn-wa {
            background-color: #25D366;
        }
        .btn-cal {
            background-color: #4285F4;
        }
        .btn-clear {
            background-color: #b5a6a3;
            margin-top: 12px;
            padding: 10px;
            font-size: 14px;
        }
        .admin-box {
            background-color: #f0f4ff;
            border: 2px dashed #4285F4;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .admin-box h3 {
            margin: 0 0 8px 0;
            color: #2b579a;
            font-size: 16px;
        }
        .a11y-btn {
            position: fixed;
            top: 14px;
            left: 14px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #2b579a;
            color: white;
            border: 2px solid white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .a11y-menu {
            position: fixed;
            top: 66px;
            left: 14px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 210px;
        }
        .a11y-menu h4 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }
        .a11y-menu button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f9f9f9;
            color: #333;
            font-size: 14px;
            text-align: right;
            cursor: pointer;
        }
        .a11y-menu button:last-child {
            margin-bottom: 0;
        }
        body.large-text .container {
            font-size: 120%;
        }
        body.large-text label.field-label,
        body.large-text input,
        body.large-text select,
        body.large-text textarea,
        body.large-text .radio-option label,
        body.large-text .disclaimer-box,
        body.large-text .cake-info-badge {
            font-size: 18px !important;
        }
        body.high-contrast {
            background-color: #000 !important;
            color: #fff !important;
        }
        body.high-contrast .container {
            background-color: #111 !important;
            border: 2px solid #ffff00 !important;
            box-shadow: none !important;
        }
        body.high-contrast h1.brand-title,
        body.high-contrast label.field-label,
        body.high-contrast p.subtitle,
        body.high-contrast .disclaimer-box,
        body.high-contrast .cake-info-badge {
            color: #ffff00 !important;
            background-color: #000 !important;
            border-color: #ffff00 !important;
        }
        body.high-contrast input,
        body.high-contrast select,
        body.high-contrast textarea {
            background-color: #000 !important;
            color: #fff !important;
            border: 2px solid #ffff00 !important;
        }
        body.high-contrast .radio-option label {
            background-color: #000 !important;
            color: #fff !important;
            border: 2px solid #ffff00 !important;
        }
        body.high-contrast .radio-option input[type="radio"]:checked + label,
        body.high-contrast .cake-info-guests {
            background-color: #ffff00 !important;
            color: #000 !important;
        }
    </style>
</head>
<body>

<button type="button" class="a11y-btn" onclick="toggleA11yMenu()" aria-label="תפריט נגישות" title="נגישות">♿</button>
<div class="a11y-menu hidden" id="a11yMenu">
    <h4>התאמות נגישות</h4>
    <button type="button" onclick="toggleLargeText()">🔍 הגדלת טקסט</button>
    <button type="button" onclick="toggleHighContrast()">🌗 ניגודיות גבוהה</button>
    <button type="button" onclick="resetA11y()">🔄 איפוס נגישות</button>
</div>

<div class="container" id="mainContainer">
    
    <div class="admin-box hidden" id="adminPanel">
        <h3>📅 הוספת הזמנה שאושרה ליומן</h3>
        <p style="font-size: 13px; margin: 0 0 10px 0; color: #444;">העתיקו את הודעת הוואטסאפ מהלקוח והדביקו כאן:</p>
        <textarea id="pasteOrderText" placeholder="הדביקו כאן את תוכן ההזמנה מוואטסאפ..." style="min-height: 90px; font-size: 14px;"></textarea>
        <button type="button" class="btn btn-cal" style="margin-top: 10px; padding: 12px; font-size: 15px;" onclick="parseAndOpenCalendar()">הוסף ליומן גוגל 📅</button>
    </div>

    <div class="brand-header">
        <img src="logo.png" alt="העוגות של הודיה" class="brand-logo-clean">
        <h1 class="brand-title">העוגות של הודיה</h1>
        <p class="subtitle">איזו עוגה הייתם רוצים להזמין</p>
    </div>
    
    <div class="form-group">
        <label class="field-label" for="customerName">שם מלא:</label>
        <input type="text" id="customerName" required>
    </div>

    <div class="row">
        <div class="form-group">
            <label class="field-label" for="orderDate">תאריך מבוקש:</label>
            <input type="date" id="orderDate" required>
        </div>
        <div class="form-group">
            <label class="field-label" for="orderTime">שעה (לא חובה):</label>
            <input type="time" id="orderTime">
        </div>
    </div>

    <div class="form-group">
        <label class="field-label" for="deliveryType">אופן קבלה:</label>
        <select id="deliveryType" onchange="toggleAddress()">
            <option value="איסוף עצמי">איסוף עצמי</option>
            <option value="משלוח">משלוח</option>
        </select>
    </div>

    <div class="form-group hidden" id="addressGroup">
        <label class="field-label" for="deliveryAddress">כתובת למשלוח:</label>
        <input type="text" id="deliveryAddress" placeholder="רחוב, מספר בית, עיר">
    </div>

    <div class="form-group">
        <label class="field-label" for="cakeType">סוג העוגה:</label>
        <select id="cakeType" onchange="toggleCakeDetails()">
            <option value="" selected>-- בחרו סוג עוגה --</option>
            <option value="בנטו (קוטר 10 ס&quot;מ, גובה 6 ס&quot;מ - מתאים לזוג)">בנטו • קוטר 10 ס"מ, גובה 6 ס"מ (🧑‍🤝‍🧑 2)</option>
            <option value="בנטו לב (קוטר 10 ס&quot;מ, גובה 6 ס&quot;מ - מתאים לזוג)">בנטו לב • קוטר 10 ס"מ, גובה 6 ס"מ (🧑‍🤝‍🧑 2)</option>
            <option value="מארז בנטו (עוגת בנטו קוטר 10 ס&quot;מ, גובה 6 ס&quot;מ + 6 קאפקייקס מעוצבים)">מארז בנטו • עוגת בנטו + 6 קאפקייקס מעוצבים</option>
            <option value="מיני (קוטר 12 ס&quot;מ, גובה 10 ס&quot;מ - 8-10 אנשים)">מיני • קוטר 12 ס"מ, גובה 10 ס"מ (🧑‍🤝‍🧑 8-10)</option>
            <option value="מיני לב (קוטר 12 ס&quot;מ, גובה 10 ס&quot;מ - 8-10 אנשים)">מיני לב • קוטר 12 ס"מ, גובה 10 ס"מ (🧑‍🤝‍🧑 8-10)</option>
            <option value="עוגה מעוצבת (קוטר 20 ס&quot;מ - 18-20 אנשים)">עוגה מעוצבת • קוטר 20 ס"מ (🧑‍🤝‍🧑 18-20)</option>
            <option value="עוגה מעוצבת לב (קוטר 20 ס&quot;מ - 18-20 אנשים)">עוגה מעוצבת לב • קוטר 20 ס"מ (🧑‍🤝‍🧑 18-20)</option>
            <option value="עוגת גן A4 (כולל דף סוכר ועיצוב אישי)">עוגת גן A4 • כולל דף סוכר ועיצוב אישי</option>
            <option value="עוגת גן A3 (כולל דף סוכר ועיצוב אישי)">עוגת גן A3 • כולל דף סוכר ועיצוב אישי</option>
            <option value="בצק פריך">בצק פריך</option>
            <option value="מוס">מוס</option>
            <option value="אחר">אחר (מלל חופשי)</option>
        </select>

        <div class="cake-info-badge hidden" id="cakeInfoBadge">
            <span id="cakeDimensionsText"></span>
            <span class="cake-info-guests" id="cakeGuestsText"></span>
        </div>
    </div>

    <div class="form-group hidden" id="shortbreadGroup">
        <label class="field-label" for="shortbreadDetails">תוכן הבצק הפריך (צורה, מספר, אות, קישוטים):</label>
        <textarea id="shortbreadDetails" placeholder="לדוגמה: ספרה 30, שוקולדים, פירות, מקרונים..."></textarea>
    </div>

    <div class="form-group hidden" id="customCakeGroup">
        <label class="field-label" for="customCakeText">פירוט סוג העוגה:</label>
        <input type="text" id="customCakeText" placeholder="הקלידו כאן את סוג העוגה או המאפה">
    </div>

    <div class="form-group">
        <label class="field-label">כשרות:</label>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="kosherDairy" name="kosher" value="חלבי">
                <label for="kosherDairy">חלבי</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="kosherIsrael" name="kosher" value="חלבי - חלב ישראל">
                <label for="kosherIsrael">חלבי - חלב ישראל</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="kosherParve" name="kosher" value="פרווה">
                <label for="kosherParve">פרווה</label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="field-label">בסיס העוגה:</label>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="flavorSponge" name="flavor" value="טורט">
                <label for="flavorSponge">טורט</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="flavorChoc" name="flavor" value="שוקולד">
                <label for="flavorChoc">שוקולד</label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="field-label" for="allergies">רגישויות / אלרגיות (לא חובה):</label>
        <input type="text" id="allergies" placeholder="לדוגמה: ללא גלוטן, אגוזים, לקטוז...">
    </div>

    <div class="form-group">
        <label class="field-label" for="cakeText">כיתוב על העוגה (לא חובה):</label>
        <input type="text" id="cakeText">
    </div>

    <div class="form-group">
        <label class="field-label" for="cakeDesign">עיצוב וצבעים (לא חובה):</label>
        <textarea id="cakeDesign"></textarea>
    </div>

    <div class="form-group">
        <label class="field-label" for="orderNotes">הערות ודגשים (לא חובה):</label>
        <textarea id="orderNotes"></textarea>
    </div>

    <div class="disclaimer-box">
        שימו לב: שליחת הפרטים אינה מהווה אישור סופי או התחייבות להזמנה. אישור ההזמנה ותיאום התשלום יתבצעו מולכם בהודעה חוזרת בוואטסאפ.
    </div>

    <button type="button" class="btn btn-wa" onclick="sendOrderToWhatsApp()">שליחת העוגה שהייתי רוצה בוואטסאפ 📲</button>
    <button type="button" class="btn btn-clear" onclick="clearForm()">נקה טופס</button>
</div>
<script>
    const MY_PHONE = '972546686383';

    const COLOR_PEOPLE_SVG = '<svg class="people-icon" viewBox="0 0 24 24">' +
        '<circle cx="16.5" cy="7.5" r="2.5" fill="#64b5f6"/>' +
        '<path d="M16.5 11.5c-2.2 0-4.5 1.1-4.5 3.2V17h9v-2.3c0-2.1-2.3-3.2-4.5-3.2z" fill="#64b5f6"/>' +
        '<circle cx="8.5" cy="7.5" r="3" fill="#d65a62"/>' +
        '<path d="M8.5 12c-2.8 0-5.5 1.4-5.5 4v2.5h11V16c0-2.6-2.7-4-5.5-4z" fill="#d65a62"/>' +
    '</svg>';

    (function checkAdminMode() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('admin') === '1') {
            document.getElementById('adminPanel').classList.remove('hidden');
        }
    })();

    function parseAndOpenCalendar() {
        const raw = document.getElementById('pasteOrderText').value.trim();
        if (!raw) {
            alert('נא להדביק קודם את הודעת ההזמנה מוואטסאפ.');
            return;
        }

        const cleanRaw = raw.replace(/\*/g, '');
        const nameMatch = cleanRaw.match(/שם:\s*(.+)/);
        const dateMatch = cleanRaw.match(/מועד:\s*(\d{2})\/(\d{2})\/(\d{4})(?:\s+בשעה\s+(\d{2}:\d{2}))?/);
        const cakeMatch = cleanRaw.match(/סוג עוגה:\s*(.+)/);
        const deliveryMatch = cleanRaw.match(/אופן קבלה:\s*(.+)/);

        if (!dateMatch) {
            alert('לא זוהה תאריך תקין בהודעה. ודאו שהעתקתם את כל הודעת ההזמנה.');
            return;
        }

        const customerName = nameMatch ? nameMatch[1].trim() : 'לקוח/ה';
        const day = dateMatch[1];
        const month = dateMatch[2];
        const year = dateMatch[3];
        const timeStr = dateMatch[4] || '';
        const isoDate = year + '-' + month + '-' + day;
        const cleanDate = year + month + day;

        let datesParam = '';
        if (timeStr) {
            const cleanTime = timeStr.replace(':', '') + '00';
            const startStr = cleanDate + 'T' + cleanTime;
            const startObj = new Date(isoDate + 'T' + timeStr);
            const endObj = new Date(startObj.getTime() + 60 * 60 * 1000);
            
            const endY = endObj.getFullYear();
            const endM = String(endObj.getMonth() + 1).padStart(2, '0');
            const endD = String(endObj.getDate()).padStart(2, '0');
            const endH = String(endObj.getHours()).padStart(2, '0');
            const endMin = String(endObj.getMinutes()).padStart(2, '0');
            
            datesParam = startStr + '/' + endY + endM + endD + 'T' + endH + endMin + '00';
        } else {
            const startObj = new Date(isoDate + 'T12:00:00');
            const nextObj = new Date(startObj.getTime() + 24 * 60 * 60 * 1000);
            const nextY = nextObj.getFullYear();
            const nextM = String(nextObj.getMonth() + 1).padStart(2, '0');
            const nextD = String(nextObj.getDate()).padStart(2, '0');
            datesParam = cleanDate + '/' + nextY + nextM + nextD;
        }

        const cakeShort = cakeMatch ? ' - ' + cakeMatch[1].split(' (')[0].trim() : '';
        const title = encodeURIComponent('הזמנה: ' + customerName + cakeShort);
        const location = encodeURIComponent(deliveryMatch ? deliveryMatch[1].trim() : 'איסוף עצמי');
        const details = encodeURIComponent(cleanRaw);

        const calUrl = 'https://google.com' + title + '&dates=' + datesParam + '&details=' + details + '&location=' + location;
        window.open(calUrl, '_blank');
    }

    function toggleA11yMenu() {
        document.getElementById('a11yMenu').classList.toggle('hidden');
    }

    function toggleLargeText() {
        document.body.classList.toggle('large-text');
    }

    function toggleHighContrast() {
        document.body.classList.toggle('high-contrast');
    }

    function resetA11y() {
        document.body.classList.remove('large-text', 'high-contrast');
        document.getElementById('a11yMenu').classList.add('hidden');
    }

    function toggleAddress() {
        const type = document.getElementById('deliveryType').value;
        const addressGroup = document.getElementById('addressGroup');
        if (type === 'משלוח') {
            addressGroup.classList.remove('hidden');
        } else {
            addressGroup.classList.add('hidden');
        }
    }

    function toggleCakeDetails() {
        const cakeType = document.getElementById('cakeType').value;
        const customCakeGroup = document.getElementById('customCakeGroup');
        const customCakeInput = document.getElementById('customCakeText');
        const shortbreadGroup = document.getElementById('shortbreadGroup');
        const shortbreadInput = document.getElementById('shortbreadDetails');
        
        const infoBadge = document.getElementById('cakeInfoBadge');
        const dimText = document.getElementById('cakeDimensionsText');
        const guestsText = document.getElementById('cakeGuestsText');

        customCakeGroup.classList.add('hidden');
        shortbreadGroup.classList.add('hidden');
        infoBadge.classList.add('hidden');

        if (cakeType.startsWith('מארז בנטו')) {
            dimText.textContent = 'קוטר 10 ס"מ, גובה 6 ס"מ';
            guestsText.textContent = 'עוגת בנטו + 6 קאפקייקס מעוצבים';
            infoBadge.classList.remove('hidden');
        } else if (cakeType.includes('בנטו')) {
            dimText.textContent = 'קוטר 10 ס"מ | גובה 6 ס"מ';
            guestsText.innerHTML = COLOR_PEOPLE_SVG + '<span>2</span>';
            infoBadge.classList.remove('hidden');
        } else if (cakeType.includes('מיני')) {
            dimText.textContent = 'קוטר 12 ס"מ | גובה 10 ס"מ';
            guestsText.innerHTML = COLOR_PEOPLE_SVG + '<span>8-10</span>';
            infoBadge.classList.remove('hidden');
        } else if (cakeType.includes('עוגה מעוצבת')) {
            dimText.textContent = 'קוטר 20 ס"מ';
            guestsText.innerHTML = COLOR_PEOPLE_SVG + '<span>18-20</span>';
            infoBadge.classList.remove('hidden');
        } else if (cakeType.startsWith('עוגת גן ')) {
            dimText.textContent = cakeType.startsWith('עוגת גן A4') ? 'גודל A4' : 'גודל A3';
            guestsText.textContent = 'כולל דף סוכר ועיצוב אישי';
            infoBadge.classList.remove('hidden');
        }

        if (cakeType === 'אחר') {
            customCakeGroup.classList.remove('hidden');
            customCakeInput.focus();
        } else if (cakeType === 'בצק פריך') {
            shortbreadGroup.classList.remove('hidden');
            shortbreadInput.focus();
        }
    }
    function formatDateHebrew(dateStr) {
        if (!dateStr) return '';
        return dateStr.split('-').reverse().join('/');
    }

    function getRadioValue(name) {
        const checked = document.querySelector('input[name="' + name + '"]:checked');
        return checked ? checked.value : '';
    }

    function getFormData() {
        const name = document.getElementById('customerName').value.trim();
        const date = document.getElementById('orderDate').value;
        const time = document.getElementById('orderTime').value;
        const type = document.getElementById('deliveryType').value;
        const address = document.getElementById('deliveryAddress').value.trim();
        
        const cakeSelect = document.getElementById('cakeType').value;
        const customCake = document.getElementById('customCakeText').value.trim();
        const shortbread = document.getElementById('shortbreadDetails').value.trim();
        
        let cake = cakeSelect;
        if (cakeSelect === 'אחר') {
            cake = customCake;
        } else if (cakeSelect === 'בצק פריך' && shortbread) {
            cake = 'בצק פריך (' + shortbread + ')';
        }

        const kosher = getRadioValue('kosher');
        const flavor = getRadioValue('flavor');
        const allergies = document.getElementById('allergies').value.trim();
        const cakeText = document.getElementById('cakeText').value.trim();
        const design = document.getElementById('cakeDesign').value.trim();
        const notes = document.getElementById('orderNotes').value.trim();

        if (!name || !date) {
            alert('נא למלא שם מלא ותאריך מבוקש.');
            return null;
        }
        return { name, date, time, type, address, cake, kosher, flavor, allergies, cakeText, design, notes };
    }

    function sendOrderToWhatsApp() {
        const data = getFormData();
        if (!data) return;

        const deliveryText = data.type === 'משלוח' 
            ? 'משלוח לכתובת: ' + (data.address || 'לא צוינה כתובת') 
            : 'איסוף עצמי';

        const timeText = data.time ? ' בשעה ' + data.time : '';

        let text = '*🧁 הזמנה חדשה - העוגות של הודיה 🧁*\n\n';
        text += '*שם:* ' + data.name + '\n';
        text += '*מועד:* ' + formatDateHebrew(data.date) + timeText + '\n';
        text += '*אופן קבלה:* ' + deliveryText + '\n';
        
        if (data.cake) {
            text += '*סוג עוגה:* ' + data.cake + '\n';
        }
        
        let specs = [];
        if (data.kosher) specs.push('*כשרות:* ' + data.kosher);
        if (data.flavor) specs.push('*בסיס:* ' + data.flavor);
        if (specs.length > 0) {
            text += specs.join(' | ') + '\n';
        }

        if (data.allergies) {
            text += '*⚠️ רגישויות:* ' + data.allergies + '\n';
        }
        
        if (data.cakeText) {
            text += '*כיתוב על העוגה:* ' + data.cakeText + '\n';
        }
        if (data.design) {
            text += '*עיצוב וצבעים:* ' + data.design + '\n';
        }
        if (data.notes) {
            text += '*הערות:* ' + data.notes + '\n';
        }

        const encodedText = encodeURIComponent(text.trim());
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            window.location.href = 'whatsapp://send?phone=' + MY_PHONE + '&text=' + encodedText;
        } else {
            window.open('https://whatsapp.com' + MY_PHONE + '&text=' + encodedText, '_blank');
        }
    }

    function clearForm() {
        if(confirm('לנקות את כל השדות?')) {
            document.getElementById('customerName').value = '';
            document.getElementById('orderDate').value = '';
            document.getElementById('orderTime').value = '';
            document.getElementById('deliveryType').value = 'איסוף עצמי';
            document.getElementById('deliveryAddress').value = '';
            document.getElementById('cakeType').value = '';
            document.getElementById('customCakeText').value = '';
            document.getElementById('shortbreadDetails').value = '';
            
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            
            document.getElementById('allergies').value = '';
            document.getElementById('cakeText').value = '';
            document.getElementById('cakeDesign').value = '';
            document.getElementById('orderNotes').value = '';
            
            toggleAddress();
            toggleCakeDetails();
        }
    }
</script>
